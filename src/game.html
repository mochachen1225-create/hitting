<title>小人退散</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Noto+Serif+TC:wght@700;900&family=Liu+Jian+Mao+Cao&family=Zhi+Mang+Xing&family=LXGW+WenKai+TC:wght@700&display=swap">
<style>
/* Layout: one full-screen night-shrine stage; a canvas plays the game, DOM screens float above it */
:root{
  --night:#100e18;
  --night-2:#1c1929;
  --paper:#f6f1e4;
  --cinnabar:#d8402e;
  --talisman:#ecc24c;
  --mist:#a9a3bf;
  --font-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--paper);font-family:var(--font-body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:18px;
  padding-block:calc(28px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow-y:auto;text-align:center}
.screen>:first-child{margin-top:auto}.screen>:last-child{margin-bottom:auto}
.screen.top>:first-child{margin-top:0}
h2{font-family:var(--font-display);font-weight:900;font-size:clamp(26px,7vw,34px);margin:0;letter-spacing:.06em;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--talisman);outline-offset:3px}
.btn{box-sizing:border-box;min-height:50px;padding:0 24px;border-radius:999px;border:1.5px solid rgba(246,241,228,.35);background:rgba(28,25,41,.7);font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--paper);backdrop-filter:blur(6px)}
.btn.primary{background:var(--cinnabar);border-color:var(--cinnabar);color:#fff8ef}
.btn.line{background:#06c755;border-color:#06c755;color:#fff}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

/* intro: water text */
#intro{gap:6px}
.water{width:min(92vw,520px);height:auto;overflow:visible}
.water .wt{font-family:var(--font-display);font-weight:900;font-size:92px;letter-spacing:6px;fill:var(--paper)}
.water .ghost{fill:var(--cinnabar);opacity:.55}
.water .reflect{opacity:.22}
.water .rise{animation:rise 2.6s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ripples{position:relative;width:1px;height:1px;margin-top:-40px}
.ripples i{position:absolute;left:0;top:0;width:10px;height:10px;border:1.5px solid rgba(246,241,228,.35);border-radius:50%;transform:translate(-50%,-50%) scaleY(.32);animation:ripple 3.6s linear infinite}
.ripples i:nth-child(2){animation-delay:1.2s}.ripples i:nth-child(3){animation-delay:2.4s}
@keyframes ripple{from{width:10px;height:10px;opacity:.9}to{width:420px;height:420px;opacity:0}}
.intro-sub{font-family:var(--font-display);color:var(--mist);letter-spacing:.3em;font-size:14px;margin:30px 0 26px;animation:rise 2s 1.2s ease-out both}
.lang{display:flex;gap:12px;animation:rise 1.4s 1.8s ease-out both}
.lang .btn{min-width:120px}

/* name screen */
#preview{width:200px;height:260px}
#nameIn{width:min(86vw,340px);min-height:52px;border-radius:14px;border:1.5px solid rgba(246,241,228,.35);background:rgba(16,14,24,.8);color:var(--paper);font:700 18px var(--font-body);text-align:center;padding:0 14px;-webkit-user-select:text;user-select:text}
#nameIn::placeholder{color:rgba(169,163,191,.8);font-weight:400;font-size:15px}
.note{color:var(--mist);font-size:13px;margin:0}

/* modes */
.target{color:var(--mist);font-size:14px;display:flex;align-items:center;gap:8px;margin-top:8px}
.target b{color:var(--paper);font-size:17px;max-width:55vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkbtn{background:none;border:0;color:var(--talisman);text-decoration:underline;text-underline-offset:3px;padding:6px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:min(100%,460px)}
.card{display:flex;align-items:center;gap:12px;text-align:left;padding:12px;border-radius:16px;border:1px solid rgba(246,241,228,.14);background:rgba(28,25,41,.78);min-height:72px;transition:transform .12s,border-color .12s}
.card:active{transform:scale(.97)}
.card.lit{border-color:var(--talisman);background:rgba(236,194,76,.16)}
.seal{flex:none;width:42px;height:42px;display:grid;place-items:center;background:var(--cinnabar);color:#fff6ea;font-family:var(--font-display);font-weight:900;font-size:24px;border-radius:6px;transform:rotate(-4deg);box-shadow:inset 0 0 0 2px rgba(255,246,234,.35)}
.card:nth-child(even) .seal{transform:rotate(3deg)}
.card b{display:block;font-size:16px}
.card small{display:block;color:var(--mist);font-size:12px;margin-top:2px;line-height:1.35}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
.hud-top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(176px,calc(164px + env(safe-area-inset-right,0px)))}
.iconbtn{pointer-events:auto;width:44px;height:44px;flex:none;border-radius:50%;border:1px solid rgba(246,241,228,.25);background:rgba(16,14,24,.6);font-size:22px;display:grid;place-items:center;backdrop-filter:blur(6px)}
.hud-mid{flex:1;min-width:0}
#hudTitle{font-family:var(--font-display);font-weight:900;font-size:18px;letter-spacing:.08em}
#backBtn.exit{width:auto;padding:0 14px;border-radius:99px;font-size:14px;font-weight:700}
#hudTime{font-size:13px;color:var(--mist);font-variant-numeric:tabular-nums;margin-left:6px}
#hudTime.low{color:#ff7a66}
.hp{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mist);margin-top:4px}
.bar{flex:1;height:8px;border-radius:99px;background:rgba(246,241,228,.12);overflow:hidden}
#hpFill{display:block;height:100%;width:100%;background:linear-gradient(90deg,#7d3cb5,var(--cinnabar));border-radius:99px;transition:width .2s}
#hint{position:absolute;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(88vw,420px);font-size:14px;line-height:1.5;color:var(--paper);background:rgba(16,14,24,.72);border:1px solid rgba(246,241,228,.15);padding:10px 14px;border-radius:14px;text-align:center;animation:hint 6s forwards}
@keyframes hint{0%,80%{opacity:1}100%{opacity:0}}
#chant{position:absolute;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(94vw,520px);font-family:var(--font-display);font-weight:900;font-size:clamp(18px,5.4vw,24px);letter-spacing:.06em;text-align:center;text-shadow:0 2px 10px rgba(0,0,0,.8)}
#chant .done{color:var(--talisman)}
#chant .rest{color:rgba(246,241,228,.28)}
#catSkip{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));pointer-events:auto;min-height:44px;padding:0 18px}
#musicBtn{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(max(12px,env(safe-area-inset-right,0px)) + 112px);z-index:5;pointer-events:auto;font-size:18px}
#musicBtn.off{opacity:.5}
#soundBtn{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:auto;padding:0 12px;border-radius:99px;font-size:13px;z-index:5;pointer-events:auto}

/* result */
#result{gap:14px;padding-top:calc(72px + env(safe-area-inset-top,0px))}
#result .sub{color:var(--mist);margin:0;font-size:15px;max-width:92vw;overflow-wrap:anywhere}
#talImg{width:auto;max-width:min(80vw,360px);max-height:50vh;border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.5);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.fortune{font-family:var(--font-display);font-weight:700;font-size:16px;margin:0;max-width:min(92vw,420px)}
.fortune em{font-style:normal;color:var(--talisman)}
.bless{color:var(--talisman);font-size:14px;margin:0}
.share-col{display:flex;flex-direction:column;gap:10px;width:min(100%,360px)}
.share-col .btn{width:100%}
/* version tag */
.ver{margin:0;color:rgba(169,163,191,.55);font-size:11px}
/* achievements */
#achToast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:9;padding:10px 18px;border-radius:99px;background:linear-gradient(135deg,#ffe08a,#e9b949);color:#3a2408;font-weight:700;font-size:14px;width:max-content;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.45);animation:achIn 2.4s ease both;pointer-events:none}
@keyframes achIn{0%{opacity:0;transform:translate(-50%,-12px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-8px)}}
.ach-rewards{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:min(92vw,520px)}
.ach-reward{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid rgba(169,163,191,.4);color:var(--mist)}
.ach-reward.on{border-color:var(--talisman);color:var(--talisman)}
.ach-card{display:flex;gap:12px;align-items:center;text-align:left;padding:10px 14px;border-radius:14px;border:1px solid rgba(246,241,228,.14);background:rgba(28,25,41,.78)}
.ach-card>div{min-width:0}.ach-card b{display:block;font-size:15px}.ach-card small{display:block;color:var(--mist);font-size:12px;margin-top:2px}
.ach-card.locked{opacity:.5}.ach-icon{font-size:22px;flex:none}
/* folklore codex */
.disclaimer{margin:22px 0 0;color:rgba(169,163,191,.75);font-size:11px;line-height:1.6;max-width:min(92vw,420px);animation:rise 1.4s 2s ease-out both}
.codex{display:flex;flex-direction:column;gap:10px;width:min(100%,520px)}
.codex-card{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;border-radius:16px;border:1px solid rgba(246,241,228,.14);background:rgba(28,25,41,.78)}
.codex-card>div{min-width:0}.codex-card b{display:block;font-size:16px}
.codex-card p{margin:6px 0 0;color:var(--paper);font-size:14px;line-height:1.6;opacity:.9}
.codex-card.locked{opacity:.55}.codex-card.locked .seal{background:#5b5670}
.codex-tag{display:inline-block;margin-top:4px;font-size:11px;color:var(--talisman);border:1px solid rgba(236,194,76,.5);border-radius:99px;padding:1px 8px}
.codex-note{max-width:min(92vw,520px);line-height:1.6}
/* daily challenge banner */
.daily{display:flex;align-items:center;gap:12px;width:min(100%,460px);text-align:left;padding:12px 14px;border-radius:16px;border:1.5px solid var(--talisman);background:linear-gradient(135deg,rgba(236,194,76,.22),rgba(216,64,46,.2));color:var(--paper)}
.daily .seal{background:var(--talisman);color:#4a2a08}
.drawcard{border-color:rgba(246,241,228,.35);background:linear-gradient(135deg,rgba(216,64,46,.25),rgba(28,25,41,.8))}
.drawcard .seal{background:var(--cinnabar);color:#fff6ea}
.daily-txt{flex:1;min-width:0}.daily-txt b{display:block;font-size:16px}.daily-txt small{display:block;color:var(--mist);font-size:12px;margin-top:2px}
.daily-go{flex:none;padding:6px 14px;border-radius:99px;background:var(--cinnabar);color:#fff6ea;font-weight:700;font-size:14px}
/* collection + score */
.card{position:relative}
.badge{position:absolute;top:6px;right:9px;font-family:var(--font-display);font-weight:900;font-size:16px;color:var(--paper)}
.badge.gS{color:var(--talisman)}.badge.gB,.badge.gC{color:var(--mist)}
.badge.none{font-family:var(--font-body);font-weight:400;font-size:11px;color:rgba(169,163,191,.6)}
.dex{margin:0;color:var(--mist);font-size:13px}.dex.gold{color:var(--talisman)}
.score{display:flex;align-items:center;gap:14px}
.grade{flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:900;font-size:38px;background:var(--cinnabar);color:#fff6ea;box-shadow:inset 0 0 0 3px rgba(255,246,234,.4);transform:rotate(-8deg);animation:stampIn .5s .3s cubic-bezier(.2,1.6,.4,1) both}
.grade.gS{background:var(--talisman);color:#4a2a08}
.grade.gB,.grade.gC{background:#5b5670}
@keyframes stampIn{from{transform:scale(2.4) rotate(-24deg);opacity:0}to{transform:rotate(-8deg);opacity:1}}
.score-txt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.score-txt b{font-size:20px}
.newrec{color:#ffd34d;font-weight:700;font-size:14px}
.score-txt small{color:var(--mist);font-size:12px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);color:var(--night);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;width:max-content;max-width:88vw;z-index:9;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.ripples i,.water .rise,.intro-sub,.lang,#hint,.grade{animation:none}}
</style>

<canvas id="stage"></canvas>

<section id="intro" class="screen">
  <svg class="water" viewBox="0 0 440 230" role="img" aria-label="小人退散">
    <defs>
      <filter id="wave" x="-15%" y="-40%" width="130%" height="180%">
        <feTurbulence type="fractalNoise" baseFrequency="0.011 0.055" numOctaves="2" seed="4" result="n">
          <animate attributeName="baseFrequency" dur="7s" values="0.011 0.055;0.015 0.08;0.011 0.055" repeatCount="indefinite"/>
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="12" xChannelSelector="R" yChannelSelector="G">
          <animate attributeName="scale" dur="3s" values="70;12" fill="freeze"/>
        </feDisplacementMap>
      </filter>
      <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <mask id="reflMask"><rect x="0" y="118" width="440" height="110" fill="url(#fade)"/></mask>
    </defs>
    <g class="rise" filter="url(#wave)">
      <text x="223" y="113" text-anchor="middle" class="wt ghost">小人退散</text>
      <text x="220" y="110" text-anchor="middle" class="wt">小人退散</text>
    </g>
    <g class="rise reflect" mask="url(#reflMask)" filter="url(#wave)">
      <text x="220" y="-130" text-anchor="middle" class="wt" transform="scale(1,-1)">小人退散</text>
    </g>
  </svg>
  <div class="ripples" aria-hidden="true"><i></i><i></i><i></i></div>
  <p class="intro-sub">把霉運打跑 · BEGONE, PETTY PEOPLE</p>
  <div class="lang">
    <button class="btn primary" data-lang="zh" type="button">中文</button>
    <button class="btn" data-lang="en" type="button">English</button>
  </div>
  <p class="disclaimer">純屬娛樂：習俗都是傳說改編，不是真實歷史或宗教建議<br>Just for fun: folklore retold for laughs, not history or religious advice</p>
</section>

<section id="nameScr" class="screen" hidden>
  <h2 data-i18n="nameTitle"></h2>
  <canvas id="preview" width="400" height="520" aria-hidden="true"></canvas>
  <label for="nameIn" class="sr" data-i18n="nameTitle"></label>
  <input id="nameIn" maxlength="12" autocomplete="off" enterkeyhint="done">
  <p class="note" data-i18n="nameNote"></p>
  <button id="toModes" class="btn primary" type="button" data-i18n="next"></button>
</section>

<section id="modesScr" class="screen" hidden>
  <div class="target"><span data-i18n="target"></span><b id="tgtName"></b><button id="editName" class="linkbtn" type="button" data-i18n="edit"></button></div>
  <h2 data-i18n="modesTitle"></h2>
  <button id="dailyBtn" class="daily" type="button"><span class="seal">今</span><span class="daily-txt"><b id="dailyTitle"></b><small id="dailySub"></small></span><span class="daily-go" data-i18n="dailyGo"></span></button>
  <p class="dex" id="dexLine"></p>
  <div class="row"><button id="codexBtn" class="linkbtn" type="button" data-i18n="codexOpen"></button><button id="achBtn" class="linkbtn" type="button"></button></div>
  <div id="modeGrid" class="grid"></div>
  <button id="drawBtn" class="daily drawcard" type="button"><span class="seal">寫</span><span class="daily-txt"><b data-i18n="drawTitle"></b><small data-i18n="drawSub"></small></span><span class="daily-go" data-i18n="dailyGo"></span></button>
  <button id="randomBtn" class="btn primary" type="button" data-i18n="random"></button>
  <p class="ver" id="verTag"></p>
</section>

<section id="achScr" class="screen top" hidden>
  <h2 data-i18n="achTitle"></h2>
  <p class="dex" id="achCount"></p>
  <div class="ach-rewards" id="achRewards"></div>
  <div id="achList" class="codex"></div>
  <button id="achBack" class="btn" type="button" data-i18n="back"></button>
</section>

<section id="codexScr" class="screen top" hidden>
  <h2 data-i18n="codexTitle"></h2>
  <p class="dex" id="codexCount"></p>
  <p class="note codex-note" data-i18n="disclaimer"></p>
  <div id="codexList" class="codex"></div>
  <button id="codexBack" class="btn" type="button" data-i18n="back"></button>
</section>

<section id="result" class="screen top" hidden>
  <h2 id="resHead"></h2>
  <p class="sub" id="resLine"></p>
  <div class="score" id="resScore" hidden><span class="grade" id="resGrade"></span><span class="score-txt"><b id="resTime"></b><span class="newrec" id="resNew"></span><small id="resBest"></small></span></div>
  <p class="bless" id="resDaily" hidden></p>
  <p class="bless" id="resCodex" hidden></p>
  <p class="bless" id="resGold" hidden></p>
  <img id="talImg" alt="">
  <p class="fortune" id="resFortune"></p>
  <p class="bless" id="resMedal" hidden></p>
  <p class="bless" id="resBless" hidden></p>
  <div class="share-col">
    <button id="shareBtn" class="btn primary" type="button" data-i18n="share"></button>
    <a id="lineBtn" class="btn line" href="https://line.me/R/share" target="_blank" rel="noopener" data-i18n="lineText"></a>
  </div>
  <div class="row">
    <button id="againBtn" class="btn" type="button" data-i18n="again"></button>
    <button id="otherBtn" class="btn" type="button" data-i18n="other"></button>
    <button id="newBtn" class="btn" type="button" data-i18n="newT"></button>
  </div>
</section>

<div id="hud" hidden>
  <div class="hud-top">
    <button id="backBtn" class="iconbtn exit" type="button" data-i18n="exit"></button>
    <div class="hud-mid">
      <div><span id="hudTitle"></span> <span id="hudTime"></span></div>
      <div class="hp"><span data-i18n="hp"></span><div class="bar"><i id="hpFill"></i></div></div>
    </div>
  </div>
  <div id="chant" hidden><span class="done"></span><span class="rest"></span></div>
  <div id="hint"></div>
  <button id="catSkip" class="btn" type="button" data-i18n="catSkip" hidden></button>
</div>
<button id="musicBtn" class="iconbtn" type="button" hidden></button>
<button id="soundBtn" class="iconbtn" type="button" hidden></button>
<div id="toast" hidden></div>
<div id="achToast" hidden></div>

<script>
'use strict';
const VERSION='1.0.3';
const $=s=>document.querySelector(s);
const FONT_D='"Noto Serif TC","Songti TC","PMingLiU",serif';
const FONT_C='"Liu Jian Mao Cao","Zhi Mang Xing","LXGW WenKai TC","Noto Serif TC",serif';
const FONT_K='"LXGW WenKai TC","Noto Serif TC","Kaiti TC",serif';
const FONT_B='"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif';
const store={get(k,d){try{const v=localStorage.getItem('xr_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('xr_'+k,JSON.stringify(v))}catch(e){}}};

/* ---------- copy ---------- */
// seal phrases read in columns, right column first
const SEALS=['小人絕緣','百無禁忌','貴人到位','霉運清零','好運連連','萬事如意','心想事成','諸事順心'];
const MODE_IDS=['darts','slipper','burn','nail','tear','crumple','water','shake','beans','jigai'];

function hex(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function mix(a,b,k){const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')})`;}
function hash(n){const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s);}
function polyPath(c,pts){c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);c.closePath();}
function inPoly(x,y,pts){let ins=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const[xi,yi]=pts[i],[xj,yj]=pts[j];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))ins=!ins;}return ins;}
function area(p){let s=0;for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];s+=a[0]*b[1]-b[0]*a[1];}return Math.abs(s)/2;}
function centroid(p){let x=0,y=0;for(const q of p){x+=q[0];y+=q[1];}return [x/p.length,y/p.length];}
function clipHalf(poly,nx,ny,k,sg){const out=[];for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length];const da=sg*(nx*a[0]+ny*a[1]+k),db=sg*(nx*b[0]+ny*b[1]+k);if(da>=0)out.push(a);if((da>=0)!==(db>=0)){const q=da/(da-db);out.push([a[0]+(b[0]-a[0])*q,a[1]+(b[1]-a[1])*q]);}}return out;}

const A={ctx:null,master:null,noise:null};

  if(A.ctx){if(A.ctx.state==='suspended')A.ctx.resume();return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{A.ctx=new AC();}catch(e){return;}

  const len=A.ctx.sampleRate;const b=A.ctx.createBuffer(1,len,A.ctx.sampleRate);const d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;A.noise=b;

function envG(g,t0,a,peak,dec){g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(peak,t0+a);g.gain.exponentialRampToValueAtTime(0.0001,t0+a+dec);}
function noise(o){const c=A.ctx,a=o.a||0.005,dec=o.dec||0.1,t0=c.currentTime+(o.delay||0);const s=c.createBufferSource();s.buffer=A.noise;s.loop=true;
  const f=c.createBiquadFilter();f.type=o.type||'bandpass';f.frequency.setValueAtTime(o.freq||1000,t0);if(o.freqEnd)f.frequency.exponentialRampToValueAtTime(o.freqEnd,t0+a+dec);f.Q.value=o.q||1;
  const g=c.createGain();envG(g,t0,a,o.peak||0.5,dec);s.connect(f);f.connect(g);g.connect(A.master);s.start(t0,Math.random()*0.5);s.stop(t0+a+dec+0.05);}
function tone(o){const c=A.ctx,a=o.a||0.005,dec=o.dec||0.2,t0=c.currentTime+(o.delay||0);const os=c.createOscillator();os.type=o.type||'sine';os.frequency.setValueAtTime(o.freq,t0);
  if(o.freqEnd)os.frequency.exponentialRampToValueAtTime(o.freqEnd,t0+a+dec);const g=c.createGain();envG(g,t0,a,o.peak||0.3,dec);os.connect(g);g.connect(A.master);os.start(t0);os.stop(t0+a+dec+0.05);}

function drawParticles(c){for(const p of P){const k=1-p.t/p.life;c.save();c.globalAlpha=Math.max(0,k);
  switch(p.type){
   case 'fire':{c.globalCompositeOperation='lighter';const r=p.size*(.5+k*.8);const g=c.createRadialGradient(p.x,p.y,0,p.x,p.y,r);g.addColorStop(0,'rgba(255,240,180,.9)');g.addColorStop(.4,'rgba(255,140,40,.6)');g.addColorStop(1,'rgba(200,40,10,0)');c.fillStyle=g;c.beginPath();c.arc(p.x,p.y,r,0,7);c.fill();break;}
   case 'spark':c.globalCompositeOperation='lighter';c.fillStyle=p.color;c.beginPath();c.arc(p.x,p.y,p.size*k+.5,0,7);c.fill();break;

   case 'ink':{const r=p.size*(1+p.t*1.5);const g=c.createRadialGradient(p.x,p.y,0,p.x,p.y,r);g.addColorStop(0,'rgba(184,20,28,.4)');g.addColorStop(1,'rgba(184,20,28,0)');c.fillStyle=g;c.beginPath();c.arc(p.x,p.y,r,0,7);c.fill();break;}
   case 'glyph':c.font=`900 ${p.size}px ${FONT_B}`;c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';c.lineWidth=Math.max(3,p.size*.16);c.strokeStyle='rgba(28,20,30,.85)';c.strokeText(p.text,p.x,p.y);c.fillStyle=p.color;c.fillText(p.text,p.x,p.y);break;

  const p={id:e.pointerId,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,px:e.clientX,py:e.clientY,t0:now,hist:[[e.clientX,e.clientY,now]]};ptrs.set(e.pointerId,p);G&&G.down&&G.down(p);});

  p.hist.push([p.x,p.y,now]);while(p.hist.length>2&&now-p.hist[0][2]>110)p.hist.shift();G&&G.move&&G.move(p);});

function setHp(v){$('#hpFill').style.width=Math.max(0,v)+'%';}

let freezeT=0,flashT=0;const CRIT_P=.12;const critP=()=>CRIT_P*(S.daily&&S.mod==='crit'?3:1);

function crit(x,y){ach('crit');if(bumpStat('crit')>=20)ach('crit20');freezeT=.1;flashT=.14;shake(12,.22);buzz([20,30,50]);sfx('crit');sparks(x,y,26,'#fff1b0');

/* ---------- 1. darts ---------- */
const DART_GOAL=10;
function makeDarts(){const g=baseGame(),m=g.m;g.hits=0;m.s*=.8;m.y=H*.32;g.flying=[];g.cool=0;
  g.update=dt=>{const sp=1.3+(100-m.hp)/100*1.4;
    if(!g.done){g.ph=(g.ph||0)+dt*sp;m.x=W/2+Math.sin(g.ph)*W*.28;m.y=H*.32+Math.sin(g.ph*1.7)*H*.03;m.rot=Math.sin(g.ph)*.12;}
    else{m.vy+=1100*dt;m.y+=m.vy*dt;m.rot+=dt*3;}
    tickFace(m,dt);g.cool-=dt;
    for(const d of g.flying){if(!d.chk&&!g.done&&Math.abs(d.y-m.y)<200){d.chk=true;if(Math.random()<.3){g.ph+=Math.PI*.35*(Math.random()<.5?-1:1);say('taunt',m.x,headY(m),true);}}
      d.vy+=500*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.a=Math.atan2(d.vy,d.vx);
      const tx=d.x+Math.cos(d.a)*20,ty=d.y+Math.sin(d.a)*20,hit=!g.done&&hitMan(m,tx,ty);
      if(hit){d.dead=true;m.darts.push([hit[0],hit[1],d.a-m.rot]);const head=hit[1]<NECK_Y;if(head){g.heads=(g.heads||0)+1;if(g.heads>=3)ach('sharp');if(bumpStat('face')>=20)ach('face20');}sfx('thunk');buzz(20);setFace(m,'hit',.6);shake(4,.12);sparks(tx,ty,8,'#fff3c4');
        if(head){emit({type:'glyph',text:t('headshot'),x:tx,y:ty-20,vy:-60,life:.9,size:22,color:'#e9b949'});}
        say(head?pick(['headshot','face']):'dart',m.x,headY(m),head);const cr=Math.random()<critP()&&crit(tx,ty);hitFx();g.hits+=cr?2:1;damage(g,(cr?2:1)*100/DART_GOAL);}
      else if(d.y<-60||d.x<-60||d.x>W+60||d.y>H+60){d.dead=true;say('miss',m.x,headY(m));}}
    g.flying=g.flying.filter(d=>!d.dead);endCheck(g,dt);};
  g.draw=c=>{artBg(c,'darts')||drawBg(c,'#1b1626','#0d0b13');spot(c,W/2,H*.32,W*.7,.12);
    c.strokeStyle='rgba(246,241,228,.06)';c.lineWidth=1;for(let i=1;i<6;i++){c.beginPath();c.arc(W/2,H*.32,i*50,0,7);c.stroke();}
    drawMan(c,m);for(const d of g.flying)drawDart(c,d.x,d.y,d.a,1.3);
    drawGoal(c,`${S.lang==='zh'?'命中':'Hits'} ${Math.min(g.hits,DART_GOAL)} / ${DART_GOAL}`,g.hits>=7);
    if(g.cool<=0&&!g.done){const bob=Math.sin(g.t*4)*4;drawDart(c,W/2,H-110+bob,-Math.PI/2,1.5);c.fillStyle='rgba(246,241,228,.35)';c.font=`700 13px ${FONT_B}`;c.textAlign='center';c.fillText('↑',W/2,H-170+bob);}};
  g.up=p=>{if(g.done||g.cool>0)return;const[vx,vy]=velOf(p);if(vy>-250)return;let sp=Math.hypot(vx,vy),k=clamp(sp,900,2100)/sp;
    g.flying.push({x:p.x,y:Math.max(p.y,H*.55),vx:vx*k,vy:vy*k,a:Math.atan2(vy,vx)});g.cool=.28;sfx('whoosh');};
  return g;}

/* ---------- 2. slipper ---------- */
function drawSlipper(c,x,y,rot,k,al){c.save();c.globalAlpha=al;c.translate(x,y);c.rotate(rot);c.scale(k,k);
  if(IMG.slipperImg){const im=IMG.slipperImg,h=124,w=h*im.width/im.height;c.shadowColor='rgba(0,0,0,.4)';c.shadowBlur=10;c.shadowOffsetY=6;c.drawImage(im,-w/2,-h/2,w,h);c.restore();return;}
  c.shadowColor='rgba(0,0,0,.4)';c.shadowBlur=10;c.shadowOffsetY=6;c.fillStyle='#eef3f8';rr(c,-24,-58,48,116,24);c.fill();c.shadowColor='transparent';
  c.strokeStyle='#4f86c6';c.lineWidth=5;rr(c,-24,-58,48,116,24);c.stroke();
  c.strokeStyle='#2f6fb8';c.lineWidth=11;c.lineCap='round';c.beginPath();c.moveTo(-20,-6);c.quadraticCurveTo(0,-30,0,-44);c.quadraticCurveTo(0,-30,20,-6);c.stroke();c.restore();}
function renderChant(g){const line=CHANT[g.chantI%CHANT.length],n=Math.min(g.chantC,line.length);$('#chant .done').textContent=line.slice(0,n);$('#chant .rest').textContent=line.slice(n);}
const SLIP_GOAL=100,SLIP_TIME=30;
function medalFor(n){return n>=SLIP_GOAL?'gold':n>=70?'silver':n>=40?'bronze':null;}
function makeSlipper(){const g=baseGame(),m=g.m;m.vx=rand(-1,1)>0?120:-120;m.vy=rand(-60,60);g.slaps=[];g.combo=0;g.lastHit=0;g.chantI=0;g.chantC=0;g.comboPop=0;g.hits=0;g.left=SLIP_TIME;g.started=false;
  $('#chant').hidden=false;renderChant(g);
  const finish=()=>{S.slipHits=g.hits;S.slipSecs=SLIP_TIME-g.left;g.clearT=g.t;S.medal=medalFor(g.hits);g.m.hp=0;setHp(0);g.done=true;g.endT=0;sfx('ding');buzz([30,40,60]);};
  g.update=dt=>{tickFace(m,dt);
    if(g.started&&!g.done){g.left-=dt;if(g.left<=0){g.left=0;finish();}}
    if(!g.done){// runs around; faster the more it gets hit
      const maxV=160+g.hits*1.7;m.vx+=(Math.random()-.5)*600*dt;m.vy+=(Math.random()-.5)*600*dt;const v=Math.hypot(m.vx,m.vy)||1;if(v>maxV||v<maxV*.6){const k=clamp(v,maxV*.6,maxV)/v;m.vx*=k;m.vy*=k;}
      m.x+=m.vx*dt;m.y+=m.vy*dt;const mx=70*m.s,top=150+100*m.s,bot=H-140-105*m.s;
      if(m.x<mx){m.x=mx;m.vx=Math.abs(m.vx);}if(m.x>W-mx){m.x=W-mx;m.vx=-Math.abs(m.vx);}if(m.y<top){m.y=top;m.vy=Math.abs(m.vy);}if(m.y>bot){m.y=bot;m.vy=-Math.abs(m.vy);}
      m.rot=m.vx/maxV*.15+Math.sin(g.t*14)*.05;m.sx+=(1-m.sx)*Math.min(1,dt*12);m.sy+=(1-m.sy)*Math.min(1,dt*12);}
    else{m.sy=Math.max(.06,m.sy-dt*3);m.sx=Math.min(1.5,m.sx+dt*1.5);m.face='dizzy';if(g.endT>.8&&m.alpha>0){if(m.alpha===1){paperBurst(m.x,m.y+60*m.s,40,420);sfx('pop');}m.alpha=Math.max(0,m.alpha-dt*4);}}
    for(const s of g.slaps)s.t+=dt;g.slaps=g.slaps.filter(s=>s.t<.35);
    if(performance.now()-g.lastHit>900)g.combo=0;if(!g.done&&performance.now()-g.lastHit>2500&&Math.random()<dt*.8)say('taunt',m.x,headY(m));g.comboPop=Math.max(0,g.comboPop-dt*4);endCheck(g,dt);};
  g.draw=c=>{artBg(c,'slipper')||drawBg(c,'#211727','#0d0b13');spot(c,W/2,H*.5,W*.75,.13);
    c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.ellipse(m.x,m.y+105*m.s,70*m.s*m.sx,10*m.s,0,0,7);c.fill();
    drawMan(c,m);
    for(const s of g.slaps){const k=Math.min(1,s.t/.08);drawSlipper(c,s.x+30,s.y-60*(1-k),-1.2+.95*k,m.s*.8,s.t>.2?(.35-s.t)/.15:1);}
    c.save();c.textAlign='center';c.fillStyle=g.left<6&&g.started?'#ff7a66':'#f6f1e4';c.font=`900 30px ${FONT_D}`;c.fillText(`${g.left.toFixed(1)} ${t('sec')}`,W*.27,122);
    c.fillStyle=g.hits>=70?'#e9b949':'#f6f1e4';c.fillText(`${g.hits} / ${SLIP_GOAL}`,W*.73,122);c.restore();
    if(g.combo>=3){c.save();c.fillStyle='#e9b949';c.font=`900 ${24+g.comboPop*12}px ${FONT_D}`;c.textAlign='center';c.fillText(`${t('combo')} ×${g.combo}`,W/2,162);c.restore();}};
  g.down=p=>{if(g.done)return;g.slaps.push({x:p.x,y:p.y,t:0});const hit=hitMan(m,p.x,p.y,24);
    if(!hit){sfx('whoosh');if(Math.random()<.5)say('taunt',m.x,headY(m));return;}m.vx+=(m.x-p.x)*3;m.vy+=(m.y-p.y)*3;
    sfx('slap');buzz(12);if(m.bruises.length<40)m.bruises.push([hit[0],hit[1],10+Math.random()*8]);m.sy=.84;m.sx=1.1;setFace(m,'hit',.35);shake(3,.08);
    g.combo++;g.lastHit=performance.now();g.comboPop=1;if(g.combo>=30)ach('combo30');if(hit[1]<NECK_Y+2&&bumpStat('face')>=20)ach('face20');sparks(p.x,p.y,5,'#ffffff');if(hit[1]<NECK_Y+2)say('face',m.x,headY(m),performance.now()-lastSay>500);else say('hit',m.x,headY(m));

function makeBurn(){const g=baseGame(),m=g.m;m.s*=.72;m.vx=60;m.vy=-40;g.cand={x:W/2,y:H-60};g.burning=0;g.contact=false;

  c.strokeStyle='#8f7a4c';c.lineWidth=2;for(let i=0;i<24;i++){const x=tx+i/23*tw,y=ry+Math.sin(i/23*Math.PI)*13;c.beginPath();c.moveTo(x-5,y-6);c.lineTo(x+5,y+6);c.stroke();}
  c.fillStyle='#f4f0e6';for(let k=0;k<4;k++){const x=tx+tw*(.15+k*.233),y=ry+Math.sin((.15+k*.233)*Math.PI)*13+4,sw=Math.sin(t*1.5+k)*2;c.beginPath();c.moveTo(x,y);c.lineTo(x+12+sw,y);c.lineTo(x+4+sw,y+14);c.lineTo(x+16+sw,y+14);c.lineTo(x+8+sw,y+30);c.lineTo(x+20+sw,y+30);c.lineTo(x+12+sw,y+46);c.lineTo(x-2+sw,y+30);c.lineTo(x+6+sw,y+30);c.lineTo(x-6+sw,y+14);c.lineTo(x+2+sw,y+14);c.closePath();c.fill();}}

const NAIL_GOAL=10;
function makeNail(){const g=baseGame(),m=g.m;m.s*=.82;g.cxm=W/2;g.hold=null;g.hams=[];g.curA=1;g.ph=0;
  const strike=(x,y)=>{g.hams.push({x,y,t:0});const hit=!g.done&&hitMan(m,x,y);
    if(hit){m.nails.push(hit);sfx('clank');sparks(x,y,14,'#ffe7a8');shake(6,.14);buzz(35);setFace(m,'hit',.7);say('nail',m.x,headY(m));hitFx();
      const cr=m.nails.length<NAIL_GOAL&&Math.random()<critP()&&crit(x,y);if(cr)m.nails.push([hit[0]+rand(-16,16),hit[1]+rand(-16,16)]);damage(g,(cr?2:1)*100/NAIL_GOAL);}
    else{sfx('thunk');if(Math.random()<.4)say('taunt',m.x,headY(m));}};
  g.update=dt=>{tickFace(m,dt,g.hold?'scared':'smug');
    if(!g.done){const held=g.hold&&performance.now()-g.hold.t0>200;const target=held?.06:Math.max(.3,1-m.nails.length*.07);g.curA+=(target-g.curA)*Math.min(1,dt*6);
      g.ph+=dt*(2.8+m.nails.length*.15);m.x=g.cxm+Math.sin(g.ph)*W*.16*g.curA;m.rot=Math.sin(g.ph*1.3)*.25*g.curA;m.y=H*.5+Math.sin(g.ph*2)*10*g.curA;
      if(held&&m.faceT<=0)m.face='scared';}

    for(const h of g.hams)h.t+=dt;g.hams=g.hams.filter(h=>h.t<.32);endCheck(g,dt);};
  g.draw=c=>{artBg(c,'nail')||drawTree(c,g.t);drawMan(c,m);drawGoal(c,`${S.lang==='zh'?'釘子':'Nails'} ${Math.min(m.nails.length,NAIL_GOAL)} / ${NAIL_GOAL}`,m.nails.length>=7);
    for(const h of g.hams){const k=Math.min(1,h.t/.07);drawHammer(c,h.x,h.y,-1.1*(1-k),m.s*.9);}
    if(g.done&&g.endT>.25){const k=Math.min(1,(g.endT-.25)/.15),sc=2-k;c.save();c.translate(m.x,m.y);c.rotate(-.15);c.scale(sc*m.s,sc*m.s);c.globalAlpha=k*.92;
      c.fillStyle='#c81e1e';rr(c,-40,-40,80,80,8);c.fill();c.strokeStyle='#fff3e6';c.lineWidth=3;rr(c,-33,-33,66,66,5);c.stroke();
      c.fillStyle='#fff3e6';c.font=`900 50px ${FONT_D}`;c.textAlign='center';c.textBaseline='middle';c.fillText('封',0,3);c.restore();}};

/* ---------- 5. tear ---------- */
function jagged(poly,seed){const out=[];for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length],L=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.floor(L/7)),nx=-(b[1]-a[1])/(L||1),ny=(b[0]-a[0])/(L||1);
  for(let k=0;k<n;k++){const q=k/n,o=k?(hash(seed+i*31+k)-.5)*4:0;out.push([a[0]+(b[0]-a[0])*q+nx*o,a[1]+(b[1]-a[1])*q+ny*o]);}}return out;}
function hasPaper(poly){const[cxp,cyp]=centroid(poly);if(inMan(cxp,cyp))return true;for(const v of poly){const x=v[0]*.8+cxp*.2,y=v[1]*.8+cyp*.2;if(inMan(x,y)&&inPoly(x,y,poly))return true;}
  for(let i=0;i<24;i++){const a=poly[Math.floor(hash(i)*poly.length)],b=poly[Math.floor(hash(i+7)*poly.length)],q=hash(i+3);const x=(a[0]*q+b[0]*(1-q))*.7+cxp*.3,y=(a[1]*q+b[1]*(1-q))*.7+cyp*.3;if(inMan(x,y))return true;}return false;}
const SHRED_GOAL=60;
function makeTear(){const g=baseGame(),m=g.m;g.shreds=1;const R=[[-80,-100],[80,-100],[80,106],[-80,106]];g.pieces=[{poly:R,jag:jagged(R,1),ox:0,oy:0,rot:0,vx:0,vy:0,vr:0}];g.stroke=null;g.trail=[];g.pinch=null;g.cuts=0;
  const local=(pc,x,y)=>{const dx=x-(m.x+pc.ox),dy=y-(m.y+pc.oy),c=Math.cos(-pc.rot),s=Math.sin(-pc.rot);return[(dx*c-dy*s)/m.s,(dx*s+dy*c)/m.s];};
  const tryCut=(ax,ay,bx,by)=>{if(g.done)return false;let did=false;const next=[];
    let splits=0;for(const pc of g.pieces){const A=local(pc,ax,ay),B=local(pc,bx,by);const nx=-(B[1]-A[1]),ny=B[0]-A[0],k=-(nx*A[0]+ny*A[1]);
      let crosses=false;for(let i=0;i<=40;i++){const q=i/40,x=A[0]+(B[0]-A[0])*q,y=A[1]+(B[1]-A[1])*q;if(inPoly(x,y,pc.poly)&&inMan(x,y)){crosses=true;break;}}
      const P1=crosses?clipHalf(pc.poly,nx,ny,k,1):[],P2=crosses?clipHalf(pc.poly,nx,ny,k,-1):[];
      if(!crosses||P1.length<3||P2.length<3||area(P1)<40||area(P2)<40){next.push(pc);continue;}
      did=true;splits++;const L=Math.hypot(nx,ny)||1,c=Math.cos(pc.rot),s=Math.sin(pc.rot),wx=(nx*c-ny*s)/L,wy=(nx*s+ny*c)/L;
      [[P1,1],[P2,-1]].forEach(([poly,sg])=>{if(!hasPaper(poly))return;const np={poly,jag:jagged(poly,Math.random()*99),ox:pc.ox,oy:pc.oy,rot:pc.rot,vx:pc.vx+wx*sg*rand(90,160),vy:pc.vy+wy*sg*rand(90,160),vr:pc.vr+sg*rand(.3,1.2)};
        g.shreds++;if(area(poly)<260){const[cxp,cyp]=centroid(poly);const wcx=m.x+np.ox+(cxp*c-cyp*s)*m.s,wcy=m.y+np.oy+(cxp*s+cyp*c)*m.s;paperBurst(wcx,wcy,10,200);}else next.push(np);});}
    if(did){g.pieces=next;if(splits>=3)ach('multirip');g.cuts++;sfx('tear');buzz(20);setFace(m,'hit',.5);say('tear',(ax+bx)/2,Math.min(ay,by)-20);
      for(let i=0;i<8;i++){const q=i/7;emit({type:'paper',x:ax+(bx-ax)*q,y:ay+(by-ay)*q,vx:rand(-80,80),vy:rand(-120,0),g:500,life:rand(.5,1),size:rand(3,6),color:'#f6f1e4',vr:rand(-8,8)});}
      const nh=Math.max(0,100*(1-(g.shreds-1)/(SHRED_GOAL-1)));damage(g,g.pieces.length?g.m.hp-nh:999);if(g.shreds>=SHRED_GOAL)damage(g,999);}
    return did;};
  g.update=dt=>{tickFace(m,dt);if(!g.done){m.x=W/2+Math.sin(g.t*.9)*W*.16;m.y=H*.48+Math.sin(g.t*1.3)*H*.06;}
    for(const pc of g.pieces){if(g.done){pc.vy+=900*dt;pc.vr*=1;}else{pc.vx*=1-Math.min(1,3*dt);pc.vy*=1-Math.min(1,3*dt);pc.vr*=1-Math.min(1,3*dt);}
      pc.ox+=pc.vx*dt;pc.oy+=pc.vy*dt;pc.rot+=pc.vr*dt;
      if(!g.done){const lim=W/2-30;if(Math.abs(pc.ox)>lim){pc.ox=Math.sign(pc.ox)*lim;pc.vx*=-.5;}const ly=H*.38;if(Math.abs(pc.oy)>ly){pc.oy=Math.sign(pc.oy)*ly;pc.vy*=-.5;}}}
    if(g.done&&!g.burst){g.burst=true;for(const pc of g.pieces){pc.vy-=rand(100,300);pc.vr=rand(-4,4);}paperBurst(m.x,m.y,40,400);}
    for(const tr of g.trail)tr.t+=dt;g.trail=g.trail.filter(tr=>tr.t<.25);endCheck(g,dt);};
  g.draw=c=>{artBg(c,'tear')||drawBg(c,'#1a1622','#0c0a12');spot(c,W/2,H*.48,W*.75,.12);
    for(const pc of g.pieces){c.save();c.translate(m.x+pc.ox,m.y+pc.oy);c.rotate(pc.rot);c.scale(m.s,m.s);
      c.save();c.beginPath();polyPath(c,pc.poly);c.clip();drawManLocal(c,m,g.pieces.length<3);c.restore();
      c.save();c.beginPath();polyPath(c,BODY);polyPath(c,HEAD);c.clip();c.beginPath();polyPath(c,pc.jag);c.strokeStyle='#d8cfb8';c.lineWidth=2.4;c.stroke();c.restore();c.restore();}
    drawGoal(c,`${S.lang==='zh'?'碎片':'Shreds'} ${Math.min(g.shreds,SHRED_GOAL)} / ${SHRED_GOAL}`,g.shreds>=45);
    c.strokeStyle='rgba(255,255,255,.8)';c.lineCap='round';for(const tr of g.trail){c.globalAlpha=1-tr.t/.25;c.lineWidth=3;c.beginPath();c.moveTo(tr.a[0],tr.a[1]);c.lineTo(tr.b[0],tr.b[1]);c.stroke();}c.globalAlpha=1;};
  g.down=p=>{if(ptrs.size>=2){g.stroke=null;const[a,b]=[...ptrs.values()];g.pinch={d0:Math.hypot(a.x-b.x,a.y-b.y)};return;}g.stroke={id:p.id,x:p.x,y:p.y};};
  g.move=p=>{if(g.done)return;
    if(ptrs.size>=2&&g.pinch){const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);
      if(d-g.pinch.d0>60){const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=(b.x-a.x)/d,dy=(b.y-a.y)/d,px=-dy*500,py=dx*500;tryCut(mx-px,my-py,mx+px,my+py);g.pinch.d0=d;}return;}

  g.up=p=>{const s=g.stroke;if(s&&s.id===p.id){const L=Math.hypot(p.x-s.x,p.y-s.y);if(L>40){const ex=(p.x-s.x)/L*30,ey=(p.y-s.y)/L*30;tryCut(s.x-ex,s.y-ey,p.x+ex,p.y+ey);}g.stroke=null;}if(ptrs.size<2)g.pinch=null;};
  return g;}

/* ---------- 6. crumple & toss ---------- */
function drawBall(c,x,y,r,seed,rot){c.save();c.translate(x,y);c.rotate(rot);

function makeCrumple(){const g=baseGame(),m=g.m;g.phase='crumple';g.rub=null;g.pd=0;g.ball=null;g.bin={x:W/2,y:H*.36,w:Math.min(100,W*.25)};g.miss=0;g.crT=0;

    const B=g.bin;B.w=Math.min(100,W*.25)*(g.miss>=3?1.35:1);if(!g.done){const k=g.miss>=3?.5:1;B.x=W/2+Math.sin(g.t*.8)*W*.26*k;B.y=H*.36+Math.sin(g.t*1.13+1)*H*.08*k;}

        else if(dx<B.w/2+b.r){b.vy=-b.vy*.45;b.vx+=Math.sign(b.x-B.x)*140;sfx('clink',.6);}}

  g.draw=c=>{artBg(c,'crumple')||drawBg(c,'#191621','#0c0b11');spot(c,W/2,H*.45,W*.8,.1);

/* ---------- 7. water ---------- */
function makeWater(){const g=baseGame(),m=g.m;m.s*=.78;m.y=H*.28;g.surf=H*.6;g.grab=null;g.inW=false;g.bubT=0;
  const wave=x=>g.surf+Math.sin(x*.02+g.t*2)*6+Math.sin(x*.035-g.t*1.3)*4;
  const sub=()=>clamp((m.y+105*m.s-wave(m.x))/(205*m.s),0,1);
  g.update=dt=>{
    if(!g.done){
      if(g.grab&&performance.now()-g.grab.t0>1400&&Math.random()<dt*.5){g.grab=null;m.vy=-420;m.vx=rand(-200,200);say('slip',m.x,headY(m),true);}
      if(g.grab){const tx=g.grab.x+g.grab.dx,ty=g.grab.y+g.grab.dy,k=Math.min(1,dt*18);m.vx=(tx-m.x)*k/dt;m.vy=(ty-m.y)*k/dt;m.x+=(tx-m.x)*k;m.y+=(ty-m.y)*k;}
      else{const s=sub();if(s>0){m.vy+=(m.soak>.7?90:-520*s)*dt;m.vy*=1-Math.min(1,2.5*dt);m.vx*=1-Math.min(1,2*dt);}
        else{m.vy+=(H*.28-m.y)*1.2*dt;m.vx+=Math.sin(g.t*.9)*50*dt;for(const q of ptrs.values()){const fx2=m.x-q.x,fy2=m.y-q.y,fd=Math.hypot(fx2,fy2)||1;if(fd<170){m.vx+=fx2/fd*900*dt;m.vy+=fy2/fd*500*dt;}}m.vy*=1-Math.min(1,1.2*dt);m.vx*=1-Math.min(1,.8*dt);}
        m.x+=m.vx*dt;m.y+=m.vy*dt;}
      m.x=clamp(m.x,60*m.s,W-60*m.s);m.y=clamp(m.y,110+90*m.s,H-40);
      const s=sub();
      if(s>.15&&!g.inW){g.inW=true;sfx('splash');buzz(25);const wy=wave(m.x);for(let i=0;i<22;i++)emit({x:m.x+rand(-40,40),y:wy,vx:rand(-160,160),vy:rand(-380,-120),g:900,life:rand(.5,.9),size:rand(2,4),color:'rgba(170,215,255,.9)'});say('water',m.x,headY(m),true);}
      if(s<.05)g.inW=false;
      if(s>0){m.soak=Math.min(1,m.soak+dt*s*(g.grab?.3:.1));damage(g,Math.max(0,m.hp-100*(1-m.soak)));
        g.bubT-=dt;if(g.bubT<=0){g.bubT=rand(.08,.25);const[bx,by]=toWorld(m,rand(-40,40),rand(-80,80));if(by>wave(bx)){emit({type:'ring',x:bx,y:by,vy:rand(-120,-60),vx:rand(-10,10),life:rand(.6,1.2),size:rand(2,5),color:'rgba(200,230,255,.7)'});if(Math.random()<.4)sfx('bubble');}}
        if(m.faceT<=0)m.face=m.soak>.5?'cry':'scared';if(Math.random()<dt*.5)say('water',m.x,headY(m));}
      else if(m.faceT<=0)m.face='smug';
      m.rot=Math.sin(g.t*3)*.1*(1-m.soak)+m.vx*.0006;
      if(g.done){for(let i=0;i<26;i++){const[bx,by]=toWorld(m,rand(-60,60),rand(-90,95));emit({type:'paper',x:bx,y:by,vx:rand(-30,30),vy:rand(10,60),life:rand(1.2,2),size:rand(5,12),color:'rgba(210,222,230,.9)',vr:rand(-2,2)});}
        for(let i=0;i<5;i++)emit({type:'ink',x:m.x+rand(-30,30),y:m.y+rand(-40,30),vy:20,life:1.6,size:rand(18,30)});sfx('bubble');}}
    else{m.alpha=Math.max(0,m.alpha-dt*2.5);m.y+=30*dt;}

  g.draw=c=>{if(!artBg(c,'water')){drawBg(c,'#131a2a','#0a0d16');c.fillStyle='rgba(230,226,210,.85)';c.beginPath();c.arc(W*.18,H*.13,18,0,7);c.fill();}

    const wg=c.createLinearGradient(0,g.surf,0,H);wg.addColorStop(0,'rgba(60,120,180,.55)');wg.addColorStop(1,'rgba(10,30,70,.85)');c.fillStyle=wg;c.fill();
    c.strokeStyle='rgba(190,225,255,.6)';c.lineWidth=2;c.beginPath();for(let x=0;x<=W;x+=8){const y=wave(x);x?c.lineTo(x,y):c.moveTo(x,y);}c.stroke();
    c.fillStyle='rgba(230,226,210,.18)';c.beginPath();c.ellipse(W*.18,g.surf+30,22,5,0,0,7);c.fill();};
  g.down=p=>{if(g.done)return;if(hitMan(m,p.x,p.y,20))g.grab={id:p.id,x:p.x,y:p.y,dx:m.x-p.x,dy:m.y-p.y,t0:performance.now()};};

/* ---------- 8. shake ---------- */
const SHAKE_GOAL=20;
function makeShake(){const g=baseGame(),m=g.m;g.hits=0;const jw=Math.min(W*.66,270),jh=Math.min(H*.5,380);
  const J={x:W/2,y:H*.53,w:jw,h:jh,vx:0,vy:0,hx:W/2,hy:H*.53};g.J=J;m.s=g.m.s*.42;m.lx=0;m.ly=0;m.vx=0;m.vy=0;m.vr=0;g.drag=null;g.cool=0;
  try{if(typeof DeviceMotionEvent!=='undefined'&&DeviceMotionEvent.requestPermission)DeviceMotionEvent.requestPermission().catch(()=>{});}catch(e){}
  const impact=v=>{if(v<260||g.cool>0||g.done)return;g.cool=.12;const cr=Math.random()<critP()&&crit(m.x,m.y);g.hits+=cr?2:1;damage(g,(cr?2:1)*100/SHAKE_GOAL);sfx('clink',Math.min(1,v/1200));buzz(10);setFace(m,'dizzy',.8);say('shake',J.x,J.y-J.h/2-10);
    for(let i=0;i<3;i++)emit({type:'glyph',text:'✦',x:m.x+rand(-20,20),y:m.y-60*m.s,vx:rand(-60,60),vy:rand(-90,-30),life:.7,size:14,color:'#e9b949'});};
  g.update=dt=>{const px=J.x,py=J.y,pvx=J.vx,pvy=J.vy;g.cool-=dt;
    if(g.drag&&!g.done){const k=Math.min(1,dt*25);J.x+=(g.drag.x+g.drag.dx-J.x)*k;J.y+=(g.drag.y+g.drag.dy-J.y)*k;J.vx+=((J.x-px)/dt-J.vx)*.5;J.vy+=((J.y-py)/dt-J.vy)*.5;}
    else{J.vx+=((J.hx-J.x)*60-J.vx*8)*dt;J.vy+=((J.hy-J.y)*60-J.vy*8)*dt;J.x+=J.vx*dt;J.y+=J.vy*dt;}
    const ax=clamp((J.vx-pvx)/dt,-25000,25000),ay=clamp((J.vy-pvy)/dt,-25000,25000);
    const ex=-motionAcc[0]*380,ey=motionAcc[1]*380;
    m.vx+=(-ax*.9+ex)*dt;m.vy+=(900-ay*.9+ey)*dt;m.lx+=m.vx*dt;m.ly+=m.vy*dt;
    const rx=60*m.s,ry=95*m.s,iw=J.w/2-10,top=-J.h/2+34,bot=J.h/2-12;
    if(m.lx<-iw+rx){m.lx=-iw+rx;impact(Math.abs(m.vx));m.vx=Math.abs(m.vx)*.55;m.vr+=m.vy*.004;}
    if(m.lx>iw-rx){m.lx=iw-rx;impact(Math.abs(m.vx));m.vx=-Math.abs(m.vx)*.55;m.vr-=m.vy*.004;}
    if(m.ly<top+ry){m.ly=top+ry;impact(Math.abs(m.vy));m.vy=Math.abs(m.vy)*.55;m.vr+=m.vx*.004;}
    if(m.ly>bot-ry){m.ly=bot-ry;impact(Math.abs(m.vy));m.vy=-Math.abs(m.vy)*.45;m.vx*=1-Math.min(1,4*dt);m.vr-=m.vx*.002;}
    m.vr+=(-m.rot*4)*dt;m.vr*=1-Math.min(1,1.6*dt);m.rot+=m.vr*dt;m.x=J.x+m.lx;m.y=J.y+m.ly;
    if(g.done){m.face='dizzy';g.drag=null;if(Math.random()<.3)emit({type:'glyph',text:'✦',x:m.x+Math.cos(g.t*6)*30,y:m.y-80*m.s+Math.sin(g.t*6)*8,life:.5,size:13,color:'#e9b949'});}
    tickFace(m,dt);endCheck(g,dt);};
  g.draw=c=>{artBg(c,'shake')||drawBg(c,'#17141f','#0b0a10');spot(c,W/2,H*.5,W*.8,.12);const x=J.x,y=J.y,w=J.w,h=J.h;
    drawGoal(c,`${S.lang==='zh'?'撞擊':'Bonks'} ${Math.min(g.hits,SHAKE_GOAL)} / ${SHAKE_GOAL}`,g.hits>=15);

    c.fillStyle='rgba(200,225,240,.06)';rr(c,x-w/2,y-h/2+20,w,h-20,28);c.fill();
    drawMan(c,m);
    c.strokeStyle='rgba(210,235,250,.55)';c.lineWidth=3;rr(c,x-w/2,y-h/2+20,w,h-20,28);c.stroke();
    c.fillStyle='rgba(255,255,255,.12)';rr(c,x-w/2+14,y-h/2+40,14,h*.6,7);c.fill();
    const lg=c.createLinearGradient(x-w/2,0,x+w/2,0);lg.addColorStop(0,'#7a2a20');lg.addColorStop(.5,'#c2493a');lg.addColorStop(1,'#6d241c');c.fillStyle=lg;rr(c,x-w/2-6,y-h/2,w+12,30,8);c.fill();
    {const nm=S.name,ch=[...nm],vert=isCJK(nm)&&ch.length<=4,lw=vert?40:Math.min(w*.7,150),fs=vert?20:18,lh=vert?ch.length*fs*1.1+20:38,ly=y+h*.08;
      c.save();c.translate(x,ly+lh/2);c.rotate(-.04);c.fillStyle='#ecc24c';rr(c,-lw/2,-lh/2,lw,lh,3);c.fill();c.strokeStyle='#b8141c';c.lineWidth=2;rr(c,-lw/2+4,-lh/2+4,lw-8,lh-8,2);c.stroke();
      c.fillStyle='#b8141c';c.textAlign='center';c.textBaseline='middle';

  g.down=p=>{if(g.done)return;if(Math.abs(p.x-J.x)<J.w/2+40&&Math.abs(p.y-J.y)<J.h/2+40)g.drag={id:p.id,x:p.x,y:p.y,dx:J.x-p.x,dy:J.y-p.y};};
  g.move=p=>{if(g.drag&&g.drag.id===p.id){g.drag.x=p.x;g.drag.y=p.y;}};
  g.up=p=>{if(g.drag&&g.drag.id===p.id)g.drag=null;};
  return g;}

/* ---------- 9. setsubun beans: pelt the oni-masked paper man ---------- */
const BEAN_GOAL=40;
function makeBeans(){const g=baseGame(),m=g.m;m.s*=.8;m.oni=true;m.y=H*.36;g.beans=[];g.hits=0;g.vx=120;g.chantN=0;g.fuku=null;g.lastFuku=0;
  $('#chant').hidden=false;const chant=()=>{const zh=S.lang==='zh',k=g.chantN++%2;$('#chant .done').textContent=k?(zh?'福は内！（福進來！）':'Fuku wa uchi! (Luck in!)'):(zh?'鬼は外！（鬼出去！）':'Oni wa soto! (Demons out!)');$('#chant .rest').textContent='';};chant();
  g.update=dt=>{tickFace(m,dt);
    if(!g.done){g.cool=(g.cool||0)-dt;const sp=190+g.hits*5;if(Math.random()<dt*.8)g.vx=(Math.random()<.5?-1:1)*sp*rand(.7,1.2);m.x+=g.vx*dt;const mx=70*m.s;if(m.x<mx){m.x=mx;g.vx=Math.abs(g.vx);}if(m.x>W-mx){m.x=W-mx;g.vx=-Math.abs(g.vx);}
      g.hopT=(g.hopT||0)+dt*6;m.y=H*.36-Math.abs(Math.sin(g.hopT))*14;m.rot=g.vx/600;}
    else{m.y+=dt*260;m.rot+=dt*2;m.alpha=Math.max(0,m.alpha-dt*.8);}
    for(const b of g.beans){b.t+=dt;b.vy+=(b.hit?900:0)*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.rot+=dt*10;
      if(!b.hit&&!g.done&&hitMan(m,b.x,b.y,4)){b.hit=true;b.vx=rand(-120,120);b.vy=rand(-200,-60);g.hits++;sfx('clink',.35);buzz(6);setFace(m,'hit',.3);m.bruises.length<40&&m.bruises.push([...toLocal(m,b.x,b.y),6]);
        if(g.hits%6===0)say('beans',m.x,headY(m));damage(g,100/BEAN_GOAL);}
      if(!b.hit&&b.t>.5){b.hit=true;b.vx*=.3;b.vy=0;}}
    g.beans=g.beans.filter(b=>b.y<H+30&&b.t<2.5);
    if(!g.done&&!g.fuku&&g.hits-g.lastFuku>=10){g.lastFuku=g.hits;g.fuku={x:rand(60,W-60),y:175,t:0};}
    if(g.fuku){g.fuku.t+=dt;g.fuku.y+=70*dt;g.fuku.x+=Math.sin(g.fuku.t*3)*40*dt;if(g.fuku.y>H*.75)g.fuku=null;}
    endCheck(g,dt);};
  g.draw=c=>{artBg(c,'nail')||drawBg(c,'#1d1426','#0c0a12');spot(c,W/2,H*.36,W*.7,.12);drawMan(c,m);
    for(const b of g.beans){c.save();c.translate(b.x,b.y);c.rotate(b.rot);if(drawProp(c,'bean',0,0,17)){c.restore();continue;}c.fillStyle='#d9b07a';c.beginPath();c.ellipse(0,0,7,5.5,0,0,7);c.fill();c.fillStyle='rgba(255,240,210,.6)';c.beginPath();c.ellipse(-2,-2,2.5,1.6,0,0,7);c.fill();c.restore();}
    if(g.fuku&&IMG.p_fuku){const f=g.fuku;c.save();c.translate(f.x,f.y);c.rotate(Math.sin(f.t*2)*.2);drawProp(c,'fuku',0,0,70);c.restore();}
    else if(g.fuku){const f=g.fuku;c.save();c.translate(f.x,f.y);c.rotate(Math.sin(f.t*2)*.2);c.fillStyle='#d8402e';rr(c,-26,-26,52,52,6);c.fill();c.fillStyle='#ffd34d';c.font=`900 34px ${FONT_D}`;c.textAlign='center';c.textBaseline='middle';c.fillText('福',0,2);c.restore();}
    drawGoal(c,`${S.lang==='zh'?'命中':'Hits'} ${Math.min(g.hits,BEAN_GOAL)} / ${BEAN_GOAL}`,g.hits>=30);};
  g.down=p=>{if(g.done)return;const f=g.fuku;if(f&&Math.hypot(p.x-f.x,p.y-f.y)<44){g.fuku=null;g.hits+=3;damage(g,300/BEAN_GOAL);sfx('ding');sparks(f.x,f.y,20,'#ffd34d');emit({type:'glyph',text:'+3',x:f.x,y:f.y-30,vy:-60,life:.9,size:26,color:'#ffd34d'});return;}
    if(g.cool>0)return;g.cool=.32;chant();sfx('whoosh');for(let i=0;i<3;i++){const sx=W/2+rand(-30,30),sy=H-60,tx=p.x+rand(-48,48),ty=p.y+rand(-40,40),d=Math.hypot(tx-sx,ty-sy)||1,v=1500;g.beans.push({x:sx,y:sy,vx:(tx-sx)/d*v,vy:(ty-sy)/d*v,t:0,rot:rand(0,6)});}};
  return g;}

/* ---------- 10. jigai: move the bad luck onto a paper stand-in, feed the spirits, burn it ---------- */
function makeJigai(){const g=baseGame(),m=g.m;m.s*=.85;m.y=H*.46;g.phase='absorb';g.taint=0;g.grab=null;
  g.clouds=[...Array(6)].map(()=>({x:rand(50,W-50),y:rand(H*.15,H*.7),vx:rand(-50,50),vy:rand(-40,40),r:rand(22,30),ph:rand(0,6),done:false}));
  const plate={x:W*.27,y:H*.83},furnace={x:W*.78,y:H*.83};
  g.items=[{k:'pork',x:W*.2,y:H*.71},{k:'tofu',x:W*.5,y:H*.71},{k:'egg',x:W*.8,y:H*.71}].map(o=>({...o,hx:o.x,hy:o.y,fed:false}));
  const phaseHint=()=>showHint(t('jigaiHints')[g.phase]);
  g.update=dt=>{tickFace(m,dt,g.taint>.5?'scared':'smug');
    if(g.phase==='absorb'){for(const cl of g.clouds){if(cl.done||g.grab===cl)continue;cl.ph+=dt;cl.x+=cl.vx*dt+Math.sin(cl.ph*2)*20*dt;cl.y+=cl.vy*dt;
        if(cl.x<30||cl.x>W-30)cl.vx*=-1;if(cl.y<110||cl.y>H*.75)cl.vy*=-1;cl.x=clamp(cl.x,30,W-30);cl.y=clamp(cl.y,110,H*.75);}}
    if(g.phase==='burn'&&g.flying){const f=g.flying;f.t+=dt;const q=Math.min(1,f.t/.6);m.x=f.sx+(furnace.x-f.sx)*q;m.y=f.sy+(furnace.y-30-f.sy)*q-Math.sin(q*Math.PI)*120;m.rot+=dt*6;m.s*=1-dt*.6;
      if(q>=1&&!g.done){g.flying=null;m.alpha=0;sfx('ignite');buzz([30,40,60]);for(let i=0;i<40;i++)emit({type:'fire',x:furnace.x+rand(-30,30),y:furnace.y-30,vx:rand(-60,60),vy:rand(-300,-120),life:rand(.5,1.1),size:rand(14,28)});damage(g,999);}}
    if(g.done&&Math.random()<.5)emit({type:'fire',x:furnace.x+rand(-25,25),y:furnace.y-35,vy:rand(-200,-80),life:rand(.4,.9),size:rand(10,22)});
    endCheck(g,dt);};
  const drawItem=(c,o)=>{if(drawProp(c,o.k,o.x,o.y,{pork:30,tofu:46,egg:42}[o.k]))return;c.save();c.translate(o.x,o.y);
    if(o.k==='pork'){c.fillStyle='#e8908a';rr(c,-26,-14,52,28,8);c.fill();c.fillStyle='#fbe6dc';c.fillRect(-26,-4,52,7);}
    else if(o.k==='tofu'){c.fillStyle='#8a5a32';rr(c,-20,-16,40,32,4);c.fill();c.strokeStyle='rgba(255,220,170,.35)';c.lineWidth=1.5;for(let i=-1;i<=1;i++){c.beginPath();c.moveTo(i*10,-16);c.lineTo(i*10,16);c.stroke();}}
    else{c.fillStyle='#cfe6df';c.beginPath();c.ellipse(0,0,15,20,0,0,7);c.fill();c.fillStyle='rgba(255,255,255,.6)';c.beginPath();c.ellipse(-5,-7,4,6,0,0,7);c.fill();}
    c.restore();};
  g.draw=c=>{artBg(c,'burn')||drawBg(c,'#160d0c','#070505');spot(c,W/2,H*.46,W*.75,.1);
    // plate and furnace
    if(!drawProp(c,'plate',plate.x,plate.y,58)){c.fillStyle='rgba(250,245,235,.92)';c.beginPath();c.ellipse(plate.x,plate.y,62,18,0,0,7);c.fill();c.strokeStyle='#c81e1e';c.lineWidth=3;c.stroke();}
    if(IMG.p_furnace){drawProp(c,'furnace',furnace.x,furnace.y-36,124);c.fillStyle='#ffe2a0';c.font=`900 15px ${FONT_D}`;c.textAlign='center';c.fillText(S.lang==='zh'?'金爐':'Furnace',furnace.x,furnace.y+42);}
    else{c.save();c.translate(furnace.x,furnace.y);c.fillStyle='#5a1a12';rr(c,-48,-46,96,70,8);c.fill();c.fillStyle='#c8932e';c.beginPath();c.moveTo(-58,-46);c.lineTo(0,-78);c.lineTo(58,-46);c.closePath();c.fill();
    const gl=c.createRadialGradient(0,-14,4,0,-14,34);gl.addColorStop(0,'#ffd27a');gl.addColorStop(1,'#a3260f');c.fillStyle=gl;rr(c,-26,-30,52,34,6);c.fill();c.fillStyle='#ffe2a0';c.font=`900 15px ${FONT_D}`;c.textAlign='center';c.fillText(S.lang==='zh'?'金爐':'Furnace',0,16);c.restore();}
    if(m.alpha>0){drawMan(c,m);if(g.taint>0){c.save();c.globalAlpha=Math.min(.7,g.taint*.7);c.translate(m.x,m.y);c.rotate(m.rot);c.scale(m.s,m.s);c.beginPath();polyPath(c,BODY);polyPath(c,HEAD);c.fillStyle='#2a1f3a';c.fill();c.restore();}}
    for(const it of g.items){if(g.phase!=='absorb'||it.fed)drawItem(c,it);}
    if(g.phase==='absorb')for(const cl of g.clouds){if(cl.done)continue;if(IMG.p_smoke){c.save();c.translate(cl.x,cl.y);c.rotate(Math.sin(cl.ph*2)*.15);drawProp(c,'smoke',0,0,cl.r*3*(1+Math.sin(cl.ph*3)*.06));c.restore();continue;}c.save();c.translate(cl.x,cl.y);const r=cl.r*(1+Math.sin(cl.ph*3)*.06);
      const gr=c.createRadialGradient(0,0,2,0,0,r*1.4);gr.addColorStop(0,'rgba(30,20,45,.95)');gr.addColorStop(1,'rgba(30,20,45,0)');c.fillStyle=gr;c.beginPath();c.arc(0,0,r*1.4,0,7);c.fill();
      c.fillStyle='#ff5a4a';c.beginPath();c.ellipse(-7,-2,3.5,2,-.4,0,7);c.ellipse(7,-2,3.5,2,.4,0,7);c.fill();c.restore();}
    const left=g.phase==='absorb'?g.clouds.filter(x=>!x.done).length:g.phase==='offer'?g.items.filter(x=>!x.fed).length:1;
    drawGoal(c,t('jigaiGoal')[g.phase](left),false);};
  g.down=p=>{if(g.done)return;
    if(g.phase==='absorb'){const cl=g.clouds.find(o=>!o.done&&Math.hypot(o.x-p.x,o.y-p.y)<o.r*1.6);if(cl)g.grab={o:cl,id:p.id,dx:cl.x-p.x,dy:cl.y-p.y};}
    else if(g.phase==='offer'){const it=g.items.find(o=>!o.fed&&Math.hypot(o.x-p.x,o.y-p.y)<44);if(it)g.grab={o:it,id:p.id,dx:it.x-p.x,dy:it.y-p.y};}
    else if(g.phase==='burn'&&!g.flying&&hitMan(m,p.x,p.y,20)){g.flying={t:0,sx:m.x,sy:m.y};sfx('whoosh');say('burn',m.x,headY(m),true);}};
  g.move=p=>{const gr=g.grab;if(gr&&gr.id===p.id){gr.o.x=p.x+gr.dx;gr.o.y=p.y+gr.dy;}};
  g.up=p=>{const gr=g.grab;if(!gr||gr.id!==p.id)return;g.grab=null;const o=gr.o;
    if(g.phase==='absorb'){if(hitMan(m,o.x,o.y,30)){o.done=true;g.taint+=1/6;sfx('whoosh');setFace(m,'hit',.4);say('jigai',m.x,headY(m));buzz(15);
        for(let i=0;i<10;i++)emit({x:o.x,y:o.y,vx:rand(-80,80),vy:rand(-80,80),life:.6,size:rand(3,6),color:'rgba(40,25,60,.8)'});
        if(g.clouds.every(x=>x.done)){g.phase='offer';phaseHint();sfx('ding');}}}
    else if(g.phase==='offer'){if(Math.hypot(o.x-plate.x,o.y-plate.y)<70){o.fed=true;const n=g.items.filter(x=>x.fed).length;o.x=plate.x+(n-2)*34;o.y=plate.y-10;sfx('chomp');
        if(g.items.every(x=>x.fed)){g.phase='burn';phaseHint();sfx('ding');sayText(t('jigaiFed'),plate.x,plate.y-60);}}else{o.x=o.hx;o.y=o.hy;}}};
  setTimeout(phaseHint,0);
  return g;}

/* ---------- hand-drawn talisman: draw it, then stick it on the hopping paper man ---------- */
// strokes are stored in paper-relative units (0..1) so the shared talisman can redraw them at full size
function drawStrokes(c,strokes,rx,ry,rw,rh,col='#b3121c'){c.save();c.strokeStyle=col;c.fillStyle=col;c.lineCap='round';c.lineJoin='round';
  for(const st of strokes){const p=st.pts;if(p.length===1){c.beginPath();c.arc(rx+p[0][0]*rw,ry+p[0][1]*rh,p[0][2]*rw/2,0,7);c.fill();continue;}
    for(let i=1;i<p.length;i++){c.lineWidth=Math.max(1,(p[i][2]+p[i-1][2])/2*rw);c.beginPath();c.moveTo(rx+p[i-1][0]*rw,ry+p[i-1][1]*rh);c.lineTo(rx+p[i][0]*rw,ry+p[i][1]*rh);c.stroke();}}
  c.restore();}
function inkLength(strokes){let L=0;for(const st of strokes)for(let i=1;i<st.pts.length;i++)L+=Math.hypot(st.pts[i][0]-st.pts[i-1][0],(st.pts[i][1]-st.pts[i-1][1])/1.9);return L;}
function makeDraw(){const g=baseGame(),m=g.m;m.s*=.62;m.y=H*.3;m.x=-80;m.alpha=0;g.phase='draw';g.strokes=[];g.cur=null;
  const pw=Math.min(W*.62,H*.6/1.9,300),ph=pw*1.9,pr={x:(W-pw)/2,y:Math.max(110,H*.13),w:pw,h:ph};g.pr=pr;
  const btnY=Math.min(H-70,pr.y+ph+44),btns={clear:{x:W*.3,y:btnY},done:{x:W*.7,y:btnY}};
  g.fly=null;g.hop=0;g.dir=1;
  const tryThrow=()=>{if(g.fly||g.done)return;g.fly={x:W/2,y:H-110,t:0};sfx('whoosh');};
  g.update=dt=>{tickFace(m,dt);
    if(g.phase==='stick'){
      if(!g.stuck){m.alpha=Math.min(1,m.alpha+dt*3);g.hop+=dt*5;m.x+=g.dir*(90+g.tries*25)*dt;if(m.x>W-60*m.s){g.dir=-1;}if(m.x<60*m.s){g.dir=1;}
        m.y=H*.3-Math.abs(Math.sin(g.hop))*40;m.rot=Math.sin(g.hop)*.08;}
      if(g.fly){const f=g.fly;f.t+=dt;f.y-=1200*dt;const tx=m.x,ty=m.y+HEAD_CY*m.s;
        if(!g.stuck&&Math.abs(f.x-tx)<55*m.s&&f.y<=ty+20){g.stuck=true;g.fly=null;g.stickT=0;sfx('stamp');shake(8,.25);buzz([20,30,60]);setFace(m,'dizzy',9);sparks(tx,ty,24,'#ffe7a8');say('nail',m.x,headY(m),true);ach('artist');}
        else if(f.y<-60){g.fly=null;g.tries++;say('miss',m.x,headY(m),true);}}
      if(g.stuck){g.stickT+=dt;m.rot=Math.sin(g.stickT*40)*.03*(1-Math.min(1,g.stickT));if(g.stickT>1.1&&!g.done){m.hp=0;damage(g,999);paperBurst(m.x,m.y,30,300);}
        if(g.done)m.alpha=Math.max(0,m.alpha-dt*1.5);}}
    endCheck(g,dt);};
  const talismanSmall=(c,x,y,sc,rot)=>{c.save();c.translate(x,y);c.rotate(rot);const w=pr.w*sc,h=pr.h*sc;
    if(IMG.paper)c.drawImage(IMG.paper,-w/2,-h/2,w,h);else{c.fillStyle='#eec44a';c.fillRect(-w/2,-h/2,w,h);}
    drawStrokes(c,g.strokes,-w/2,-h/2,w,h);c.restore();};
  g.draw=c=>{artBg(c,'poe')||drawBg(c,'#24120f','#0d0807');
    if(g.phase==='draw'){
      c.save();c.shadowColor='rgba(0,0,0,.5)';c.shadowBlur=24;c.shadowOffsetY=10;if(IMG.paper)c.drawImage(IMG.paper,pr.x,pr.y,pr.w,pr.h);else{c.fillStyle='#eec44a';c.fillRect(pr.x,pr.y,pr.w,pr.h);}c.restore();
      c.strokeStyle='rgba(179,18,28,.25)';c.lineWidth=2;c.setLineDash([6,6]);c.strokeRect(pr.x+pr.w*.08,pr.y+pr.h*.05,pr.w*.84,pr.h*.9);c.setLineDash([]);
      drawStrokes(c,g.strokes,pr.x,pr.y,pr.w,pr.h);
      if(!g.strokes.length){c.save();c.globalAlpha=.55+Math.sin(g.t*3)*.2;c.fillStyle='#7a1a10';c.textAlign='center';c.font=`700 ${Math.min(17,W*.044)}px ${FONT_B}`;c.fillText(t('drawHere'),W/2,pr.y+pr.h/2);c.restore();}
      const ok=inkLength(g.strokes)>.8;
      [['clear',t('drawClear'),'rgba(28,25,41,.85)'],['done',t('drawDone'),ok?'#d8402e':'rgba(216,64,46,.35)']].forEach(([k,lbl,bg])=>{const b=btns[k];c.fillStyle=bg;rr(c,b.x-62,b.y-22,124,44,22);c.fill();c.strokeStyle='rgba(246,241,228,.35)';c.lineWidth=1.5;c.stroke();
        c.fillStyle='#fff6ea';c.font=`700 15px ${FONT_B}`;c.textAlign='center';c.textBaseline='middle';c.fillText(lbl,b.x,b.y+1);});}
    else{drawMan(c,m);
      if(g.stuck){const sc=Math.max(.09,62*m.s/pr.h),hh=pr.h*sc,cx0=m.x+Math.sin(m.rot)*80*m.s;talismanSmall(c,cx0,m.y+(HEAD_CY-HEAD_R*.7)*m.s+hh/2,sc,m.rot+Math.sin(g.stickT*30)*.04*(1-Math.min(1,g.stickT)));}
      if(g.fly)talismanSmall(c,g.fly.x,g.fly.y,.3,Math.sin(g.fly.t*20)*.2);
      else if(!g.stuck){const bob=Math.sin(g.t*4)*4;talismanSmall(c,W/2,H-110+bob,.3,0);c.save();c.globalAlpha=.6+Math.sin(g.t*4)*.25;c.fillStyle='#f6f1e4';c.textAlign='center';c.font=`700 15px ${FONT_B}`;c.fillText(t('drawThrow'),W/2,H-110-pr.h*.17-14);c.restore();}}};
  const inPaper=p=>p.x>=pr.x&&p.x<=pr.x+pr.w&&p.y>=pr.y&&p.y<=pr.y+pr.h;
  const toN=p=>[(p.x-pr.x)/pr.w,(p.y-pr.y)/pr.h];
  g.down=p=>{if(g.phase==='stick'){tryThrow();return;}
    const hit=k=>Math.abs(p.x-btns[k].x)<64&&Math.abs(p.y-btns[k].y)<26;
    if(hit('clear')){g.strokes=[];sfx('tear');return;}
    if(hit('done')){if(inkLength(g.strokes)>.8){g.phase='stick';g.tries=0;S.drawStrokes=g.strokes;sfx('ding');showHint(t('drawHint2'));}else toast(t('drawMore'));return;}
    if(inPaper(p)){const [nx,ny]=toN(p);g.cur={id:p.id,pts:[[nx,ny,.05]],lt:performance.now()};g.strokes.push(g.cur);}};
  g.move=p=>{const s0=g.cur;if(!s0||s0.id!==p.id||g.phase!=='draw')return;const [nx,ny]=toN(p),now=performance.now(),last=s0.pts[s0.pts.length-1];
    const d=Math.hypot((nx-last[0])*pr.w,(ny-last[1])*pr.h);if(d<2)return;const sp=d/Math.max(1,now-s0.lt);s0.lt=now;
    const w=clamp(.075-sp*.03,.022,.075);s0.pts.push([clamp(nx,0,1),clamp(ny,0,1),last[2]*.6+w*.4]);if(Math.random()<.15)sfx('crumple');};
  g.up=p=>{if(g.cur&&g.cur.id===p.id)g.cur=null;};
  return g;}

/* ---------- cat easter egg ---------- */
const COATS=[{base:'#e7953f',stripe:'#b8641c',chest:'#f8e2c4',eye:'#9bd36a'},{base:'#2b2a30',stripe:null,chest:'#2b2a30',eye:'#e8c547'},{base:'#9299a3',stripe:'#5f6670',chest:'#e7e7ea',eye:'#7ec4e8'},{base:'#f4f2ee',stripe:null,chest:'#ffffff',eye:'#7ec4e8'},{base:'#f4f0ea',stripe:null,chest:'#ffffff',eye:'#d9b23a',calico:true}];
function drawCat(c,k,coat,s,happy,tail){c.save();c.translate(k.x,k.y);c.scale(s,s);
  c.fillStyle='rgba(0,0,0,.3)';c.beginPath();c.ellipse(0,0,50,9,0,0,7);c.fill();
  c.strokeStyle=coat.base;c.lineWidth=13;c.lineCap='round';c.beginPath();c.moveTo(30,-12);c.quadraticCurveTo(70,-20+tail*6,58,-70+tail*10);c.stroke();
  c.fillStyle=coat.base;c.beginPath();c.ellipse(0,-45,40,46,0,0,7);c.fill();
  c.beginPath();c.moveTo(-34,-128);c.lineTo(-26,-158);c.lineTo(-8,-136);c.moveTo(4,-136);c.lineTo(20,-158);c.lineTo(26,-126);c.fill();
  c.beginPath();c.ellipse(-5,-108,37,32,0,0,7);c.fill();
  c.save();c.beginPath();c.ellipse(0,-45,40,46,0,0,7);c.ellipse(-5,-108,37,32,0,0,7);c.clip();
  if(coat.calico){c.fillStyle='#e08a3a';c.beginPath();c.arc(-28,-118,20,0,7);c.arc(22,-40,26,0,7);c.fill();c.fillStyle='#2b2a30';c.beginPath();c.arc(18,-112,16,0,7);c.arc(-26,-30,18,0,7);c.fill();}
  if(coat.stripe){c.strokeStyle=coat.stripe;c.lineWidth=5;for(let i=0;i<3;i++){c.beginPath();c.moveTo(-14+i*9,-138);c.lineTo(-12+i*9,-124);c.stroke();}for(let i=0;i<4;i++){c.beginPath();c.arc(0,-10-i*16,40,Math.PI*.85,Math.PI*1.05);c.stroke();c.beginPath();c.arc(0,-10-i*16,40,-Math.PI*.05,Math.PI*.15);c.stroke();}}
  c.fillStyle=coat.chest;c.beginPath();c.ellipse(-6,-40,18,28,0,0,7);c.fill();c.restore();
  if(coat.base==='#2b2a30'){c.strokeStyle='rgba(255,255,255,.25)';c.lineWidth=2;c.beginPath();c.ellipse(-5,-108,37,32,0,0,7);c.stroke();}
  c.fillStyle='#f2a6b4';c.beginPath();c.moveTo(-28,-130);c.lineTo(-25,-148);c.lineTo(-14,-135);c.moveTo(8,-135);c.lineTo(18,-148);c.lineTo(21,-130);c.fill();
  if(happy){c.strokeStyle='#2b2630';c.lineWidth=3;c.beginPath();c.arc(-19,-108,6,Math.PI*1.1,Math.PI*1.9);c.stroke();c.beginPath();c.arc(9,-108,6,Math.PI*1.1,Math.PI*1.9);c.stroke();}
  else{[-19,9].forEach(x=>{c.fillStyle=coat.eye;c.beginPath();c.ellipse(x,-110,6.5,8,0,0,7);c.fill();c.fillStyle='#111';c.beginPath();c.ellipse(x,-110,2.2,6,0,0,7);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(x+2,-113,1.6,0,7);c.fill();});}

 {id:'nail',g:'釘',zh:['日本・丑時參拜','傳說改編','日本傳說：在丑時（凌晨 1～3 點）把稻草人釘在神社的神木上，連續七晚，只要被人看見就失效。遊戲裡的小人太吵了，一定會被看見。'],en:['Japan · Ushi no Koku Mairi','Inspired by folklore','A Japanese legend: at the Hour of the Ox (1 to 3 a.m.), nail a straw doll to a shrine\'s sacred tree for seven nights. If anyone sees you, it fails. Our paper man is far too noisy to go unseen.']},
 {id:'water',g:'泡',zh:['古羅馬英國・巴斯詛咒板','傳說改編','據說古羅馬時代的英國巴斯，有人把控訴刻在金屬片上丟進聖泉，請女神懲罰小偷，很多是在澡堂被偷了衣服。遊戲省略了寫字，直接把小人泡爛。'],en:['Roman Britain · Bath Curse Tablets','Inspired by folklore','In Roman-era Bath, people are said to have scratched complaints onto metal sheets and dropped them into the sacred spring, asking the goddess to punish thieves, often for clothes stolen at the baths. We skip the paperwork and just soak the culprit.']},
 {id:'burn',g:'燒',zh:['厄瓜多・燒舊年','傳說改編','相傳在厄瓜多，跨年夜午夜會把紙紮人偶燒掉，把一整年的霉運燒光，還有人會跳過火堆。遊戲改成拿蠟燭追著燒。'],en:['Ecuador · Burning the Old Year','Inspired by folklore',"In Ecuador, it's said that at midnight on New Year's Eve people burn papier-mache effigies to torch the old year's bad luck, and some leap over the flames. Here you chase yours with a candle."]},
 {id:'shake',g:'搖',zh:['台灣・搖籤筒','靈感改編','台灣廟裡求籤要搖籤筒，搖到有一支籤掉出來。遊戲把籤換成小人，搖到它暈倒為止。'],en:['Taiwan · Fortune Sticks','Our own twist','At Taiwanese temples you shake a cup of bamboo fortune sticks until one falls out. We swapped the sticks for the paper man and shake until it is dizzy.']},
 {id:'poe',g:'筊',zh:['台灣・擲筊','傳說改編','台灣廟裡問神明會擲筊：一平一凸是聖筊（同意），兩個平面朝上是笑筊（神明笑了，換個問法），兩個凸面朝上是陰筊（不同意）。重要的事要連續三個聖筊才算數。'],en:['Taiwan · Moon Blocks','Inspired by folklore',"At Taiwanese temples you ask the gods by tossing two crescent blocks. One flat and one round side up is a 'holy cup' (yes); both flat is a 'laughing cup' (ask again); both round is a 'yin cup' (no). Big questions need three holy cups in a row."]},
 {id:'beans',g:'豆',zh:['日本・節分撒豆','傳說改編','相傳日本在節分（立春前一天，約 2 月初）會撒豆驅鬼，一邊喊「鬼は外！福は内！」（鬼出去、福進來），常由家人戴鬼面具當靶。遊戲裡的鬼是戴面具的紙小人。'],en:['Japan · Setsubun Bean Toss','Inspired by folklore',"On Setsubun, the day before spring in early February, families in Japan are said to throw roasted beans while shouting 'Oni wa soto! Fuku wa uchi!' (Demons out! Luck in!), often at a relative wearing a demon mask. Here the demon is our masked paper man."]},
 {id:'jigai',g:'改',zh:['台灣・祭改','傳說改編','相傳台灣的祭改會用紙或草做的替身，把壞運轉移到替身上，再用生豬肉、豆乾、鴨蛋等小三牲讓煞吃飽離開。遊戲把步驟簡化成拖一拖、燒一燒。'],en:['Taiwan · Jigai','Inspired by folklore',"Taiwan's jigai ritual is said to move bad luck onto a paper or straw stand-in, then offer raw pork, dried tofu and duck eggs so troublesome spirits eat and leave. We simplified it to drag, feed and burn."]},
 {id:'cat',g:'貓',zh:['遊戲原創・貓貓神','遊戲原創','香港驚蟄的習俗會祭白虎，餵牠吃肉讓牠不再作亂。我們把白老虎換成只想吃小魚乾的貓貓神。'],en:['Game Original · The Cat God','Game original',"Hong Kong's Jingzhe ritual feeds a paper white tiger so it stays out of trouble. We replaced the tiger with a Cat God who only wants dried fish."]},
 {id:'fu',g:'符',zh:['東亞・黃紙朱砂','傳說改編','東亞許多地方的符都是黃紙配紅色朱砂，韓國叫부적。遊戲的符文是「小人退散」的注音，沒有任何法力。'],en:['East Asia · Yellow Paper, Red Ink','Inspired by folklore',"Across East Asia, talismans are often red ink on yellow paper; in Korea they are called bujeok. Ours spells 'xiao ren tui san' in Zhuyin and has zero magical power."]},
 {id:'darts',g:'鏢',zh:['遊戲原創・射飛鏢','遊戲原創','沒有這種習俗，純粹覺得射飛鏢很紓壓。'],en:['Game Original · Darts','Game original','Not a real custom. Throwing darts is just very relaxing.']},
 {id:'tear',g:'撕',zh:['遊戲原創・撕碎','遊戲原創','沒有這種習俗。撕紙的聲音實在太療癒了。'],en:['Game Original · Shredding','Game original','Not a real custom. Ripping paper just sounds great.']},
 {id:'crumple',g:'揉',zh:['遊戲原創・揉爛丟掉','遊戲原創','辦公室人人都練過的傳統技藝（並不是）。'],en:['Game Original · Crumple & Toss','Game original','An ancient office tradition. (It is not.)']}

const MODS=['crit','short','tiny','giant','none'];
function dayKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function dayHash(k){let h=2166136261;for(const ch of k){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function todayChallenge(){const key=dayKey(),h=dayHash('xiaoren:'+key),mode=MODE_IDS[h%MODE_IDS.length];let mod=MODS[(h>>>8)%MODS.length];
  if(mode==='slipper'&&mod==='short')mod='crit';return{key,mode,mod};}
function getDaily(){const d=store.get('daily',{});return d&&typeof d==='object'?d:{};}
function dailyStreak(){const d=getDaily(),td=dayKey(),yd=dayKey(new Date(Date.now()-864e5));return d.last===td||d.last===yd?(d.streak||0):0;}

const GRADE_T={beans:[10,18,30],jigai:[15,25,40],darts:[15,25,40],burn:[12,20,35],nail:[10,18,30],tear:[12,20,35],crumple:[15,25,40],water:[12,20,35],shake:[8,15,25]};

function gradeOf(mode,secs,hits,timeout){if(mode==='slipper')return hits>=SLIP_GOAL?(secs<=22?'S':'A'):hits>=70?'B':'C';
  if(timeout)return 'C';const g=GRADE_T[mode];return secs<=g[0]?'S':secs<=g[1]?'A':secs<=g[2]?'B':'C';}
function better(a,b){if(!b)return true;if(GRADE_RANK[a.grade]!==GRADE_RANK[b.grade])return GRADE_RANK[a.grade]>GRADE_RANK[b.grade];
  return a.mode==='slipper'&&a.hits!==b.hits?a.hits>b.hits:a.secs<b.secs;}

const allCleared=()=>clearedCount()===MODE_IDS.length;
function recordScore(g){if(S.mode==='draw'){S.score=null;return;}markCodex(S.mode);const slip=S.mode==='slipper',secs=slip?(S.slipSecs||SLIP_TIME):(g.clearT!=null?g.clearT:g.t);
  const sc={mode:S.mode,secs:Math.round(secs*10)/10,hits:S.slipHits||0,timeout:!!g.timeout};sc.grade=gradeOf(S.mode,secs,sc.hits,sc.timeout);
  if(S.daily){const td=todayChallenge(),d=getDaily(),yd=dayKey(new Date(Date.now()-864e5));
    if(d.last!==td.key){d.streak=d.last===yd?(d.streak||0)+1:1;d.last=td.key;d.best=null;}
    sc.prev=d.best;sc.isNew=better(sc,d.best);if(sc.isNew)d.best={mode:sc.mode,grade:sc.grade,secs:sc.secs,hits:sc.hits};
    store.set('daily',d);sc.daily={key:td.key,mod:td.mod,streak:d.streak,best:d.best};sc.unlockGold=false;S.score=sc;return;}
  const prev=BEST[S.mode],wasAll=allCleared();sc.prev=prev;sc.isNew=better(sc,prev);
  if(sc.isNew){BEST[S.mode]={mode:sc.mode,grade:sc.grade,secs:sc.secs,hits:sc.hits};store.set('best',BEST);}
  sc.unlockGold=!wasAll&&allCleared();S.score=sc;}

  G=g;}
async function showResult(blessed){G=null;P.length=0;bubbles.length=0;$('#catSkip').hidden=true;markCodex('fu');
  const F=T[S.lang];S.blessed=blessed;S.fortune=blessed?F.blessed:S.poe3?F.poeFortune:pick(F.fortunes);
  const verb=F.verbs[S.mode];S.headline=pick(F.headlines);$('#resHead').textContent=S.headline;$('#resLine').textContent=F.resLine(S.name,verb);
  const md=$('#resMedal');md.hidden=S.mode!=='slipper';if(S.mode==='slipper')md.textContent=S.medal?'🏅 '+F.medalLine(F.medals[S.medal],S.slipHits):F.medalTry(S.slipHits);
  const fe=$('#resFortune');fe.textContent='';const em=document.createElement('em');em.textContent=S.fortune[0];fe.append(F.fortune+'：',em,'　'+S.fortune[1]);
  $('#resBless').hidden=!(blessed||S.poe3);$('#resBless').textContent=[blessed?F.catBless:'',S.poe3?F.poeBless:''].filter(Boolean).join('　');
  const sc=S.score;$('#resScore').hidden=!sc;
  if(sc){const ge=$('#resGrade');ge.textContent=sc.grade;ge.className='grade g'+sc.grade;ge.style.animation='none';void ge.offsetWidth;ge.style.animation='';
    $('#resTime').textContent=sc.timeout?F.timeUp:scoreVal(sc);$('#resNew').textContent=sc.isNew?(sc.prev?F.newRec:F.firstClear):'';
    const b=sc.daily?sc.daily.best:BEST[S.mode];$('#resBest').textContent=b&&!(sc.isNew&&!sc.prev)?(sc.daily?F.dailyBest:F.bestLine)(b.grade,scoreVal(b)):'';setTimeout(()=>sfx('stamp'),350);}
  $('#resDaily').hidden=!(sc&&sc.daily);if(sc&&sc.daily)$('#resDaily').textContent=F.dailyDone(sc.daily.streak);
  const nc=(S.newCodex||[]).map(id=>CODEX.find(c=>c.id===id)).filter(Boolean);S.newCodex=[];
  $('#resCodex').hidden=!nc.length;$('#resCodex').textContent=nc.length?F.codexNew(nc.map(c=>c[S.lang][0]).join('、')):'';
  $('#resGold').hidden=!(sc&&sc.unlockGold);$('#resGold').textContent=F.goldUnlocked;if(sc&&sc.unlockGold)setTimeout(()=>sfx('ding'),700);
  $('#lineBtn').href='https://line.me/R/share?text='+encodeURIComponent(shareText());
  $('#talImg').removeAttribute('src');$('#talImg').alt=S.headline;show('result');
  for(let i=0;i<50;i++){const a=rand(-Math.PI*.9,-Math.PI*.1),v=rand(200,520);emit({type:'paper',x:W/2,y:H*.35,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:420,life:rand(1.4,2.4),size:rand(6,11),color:pick(['#ecc24c','#d8402e','#f6f1e4']),vr:rand(-9,9),drag:.8});}
  const r=await makeTalisman(S.name,verb,S.fortune,blessed);$('#talImg').src=r.url;S.talBlob=r.blob;}
let DL=null;try{if(window.claude&&window.claude.use)window.claude.use('downloads').then(d=>{DL=d}).catch(()=>{});}catch(e){}
function scoreLine(){const F=T[S.lang],sc=S.score;if(!sc)return '';return sc.mode==='slipper'?F.scoreSlip(sc.hits,sc.grade):F.scoreTime(sc.secs,sc.grade);}
function shareText(){const F=T[S.lang],sc=S.score;let s=(sc&&sc.daily?F.dailyShare(mmdd(sc.daily.key),F.modes[S.mode][0],F.mods[sc.daily.mod],sc.daily.streak)+'\n':'')+F.shareMsg(S.headline,S.name,F.verbs[S.mode],S.fortune[0]+' '+S.fortune[1],scoreLine());if(S.medal)s+='\n🏅 '+F.medalLine(F.medals[S.medal],S.slipHits);return s+'\n'+F.challenge+' '+GAME_URL;}
async function doShare(){const blob=S.talBlob;if(!blob)return;ach('share');const msg=shareText();
  try{const file=new File([blob],'xiaoren-tuisan.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text:msg});return;}}
  catch(e){if(e&&e.name==='AbortError')return;}
  if(DL){try{await DL.save({filename:'xiaoren-tuisan.png',data:blob});toast(t('saved'));return;}catch(e){if(e&&e.code==='declined')return;}}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='xiaoren-tuisan.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}catch(e){}
  toast(t('holdHint'));}

/* preview on the name screen */
const pv=$('#preview'),pc=pv.getContext('2d'),pman=newMan(200,270,1.9);
function drawPreview(time){pc.clearRect(0,0,400,520);pman.name=$('#nameIn').value.trim()||t('defaultName');pman.rot=Math.sin(time/700)*.05;pman.y=270+Math.sin(time/500)*5;drawMan(pc,pman);}

/* wiring */
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{audioInit();musicInit();S.lang=b.dataset.lang;store.set('lang',S.lang);applyLang();sfx('drip');$('#nameIn').value=S.name;show('nameScr');}));
function goModes(){const v=$('#nameIn').value.trim();S.name=v||t('defaultName');store.set('name',v);$('#tgtName').textContent=S.name;show('modesScr');}
$('#toModes').addEventListener('click',goModes);
$('#nameIn').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#nameIn').blur();goModes();}});
$('#editName').addEventListener('click',()=>show('nameScr'));
$('#codexBtn').addEventListener('click',()=>show('codexScr'));
$('#achBtn').addEventListener('click',()=>show('achScr'));
$('#achBack').addEventListener('click',()=>show('modesScr'));
$('#lineBtn').addEventListener('click',()=>ach('share'));
$('#codexBack').addEventListener('click',()=>show('modesScr'));
$('#drawBtn').addEventListener('click',()=>{audioInit();startMode('draw');});
$('#dailyBtn').addEventListener('click',()=>{audioInit();startMode(todayChallenge().mode,true);});
$('#randomBtn').addEventListener('click',()=>{audioInit();const cards=[...document.querySelectorAll('.card')];const final=Math.floor(Math.random()*cards.length);let i=0;const total=14+final;
  $('#randomBtn').disabled=true;const step=()=>{cards.forEach(c=>c.classList.remove('lit'));cards[i%cards.length].classList.add('lit');sfx('pop');
    if(i>=total){setTimeout(()=>{cards.forEach(c=>c.classList.remove('lit'));$('#randomBtn').disabled=false;startMode(MODE_IDS[final]);},450);return;}i++;setTimeout(step,50+i*i*.9);};step();});
$('#backBtn').addEventListener('click',()=>{G=null;P.length=0;bubbles.length=0;$('#chant').hidden=true;show('modesScr');});
$('#soundBtn').addEventListener('click',()=>{audioInit();setSound(!S.sound);});
$('#musicBtn').addEventListener('click',()=>{musicInit();setMusic(!MUSIC.on);});
$('#catSkip').addEventListener('click',()=>{if(G&&G.skip)G.skip();else showResult(false);});
$('#shareBtn').addEventListener('click',doShare);
$('#againBtn').addEventListener('click',()=>startMode(S.mode,S.daily));
$('#otherBtn').addEventListener('click',()=>show('modesScr'));
$('#newBtn').addEventListener('click',()=>{$('#nameIn').value='';show('nameScr');});
applyLang();
if(S.lang==='en'){document.querySelector('[data-lang="en"]').classList.add('primary');document.querySelector('[data-lang="zh"]').classList.remove('primary');}
$('#verTag').textContent='v'+VERSION;

/* main loop */
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000)||.016;last=now;cx.setTransform(DPR,0,0,DPR,0,0);cx.save();
  if(shakeT>0){shakeT-=dt;cx.translate((Math.random()-.5)*shakeA,(Math.random()-.5)*shakeA);}
  if(G&&freezeT>0)freezeT-=dt;
  else if(G){G.t+=dt;
    // every round has an end: 60 s cap (the slipper round runs its own 30 s clock)
    if(G.m&&S.mode!=='slipper'&&S.mode!=='draw'){const left=Math.max(0,roundMax()-G.t),el=$('#hudTime');if(!G.done&&left<=0){G.timeout=true;damage(G,999);}
      const txt=G.done?'':`${Math.ceil(left)} ${t('sec')}`;if(el.textContent!==txt)el.textContent=txt;el.classList.toggle('low',left<10);}
    G.update(dt);}
  if(G)G.draw(cx);else drawAmbient(cx,dt);
  updParticles(dt);drawParticles(cx);drawBubbles(cx,dt);
  if(flashT>0){flashT-=dt;cx.fillStyle=`rgba(255,250,235,${Math.max(0,flashT)*3})`;cx.fillRect(-30,-30,W+60,H+60);}cx.restore();
  if(screen==='nameScr')drawPreview(now);requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
